<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ali & Yara — Envelope Opening</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3ee}
.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;perspective:1600px}
.envelope{position:relative;width:min(100vw,1920px);aspect-ratio:1672/941;background:url("assets/exact-envelope.png") center/cover no-repeat;overflow:visible;filter:drop-shadow(0 20px 35px rgba(50,30,30,.14))}
.inner{position:absolute;inset:0;background:#f7f3ee;clip-path:polygon(0 0,100% 0,50% 50.5%,0 100%,100% 100%);opacity:0;transition:opacity .9s ease 1.1s}
.flap{position:absolute;inset:0;background:url("assets/exact-envelope.png") center/cover no-repeat;clip-path:polygon(0 0,100% 0,50% 50.5%);transform-origin:50% 0%;transform:rotateX(0deg);backface-visibility:hidden;transition:transform 1.5s cubic-bezier(.2,.75,.15,1)}
.seal{position:absolute;left:50%;top:50.5%;width:15.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:url("assets/exact-envelope.png") center 49.5%/646% auto no-repeat;box-shadow:0 5px 12px rgba(60,10,40,.18);transition:opacity .45s ease .18s,transform .7s ease}
.opening .inner{opacity:1}
.opening .flap{transform:rotateX(-172deg)}
.opening .seal{opacity:0;transform:translate(-50%,-50%) scale(.72)}
.open{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:10;border:0;background:rgba(255,255,255,.88);padding:14px 30px;border-radius:999px;color:#8c174f;letter-spacing:2px;font:600 14px Georgia,serif;box-shadow:0 8px 25px rgba(70,20,45,.12);cursor:pointer}
.open:hover{transform:translateX(-50%) translateY(-2px)}
@media(max-width:700px){.envelope{width:100vw}.open{bottom:3%}}
</style></head>
<body>
<div class="stage"><div class="envelope" id="env"><div class="inner"></div><div class="flap"></div><div class="seal"></div><button class="open" id="open">OPEN INVITATION</button></div></div>
<script>
document.getElementById('open').addEventListener('click',()=>{
  document.getElementById('env').classList.add('opening');
  document.getElementById('open').style.opacity='0';
  setTimeout(()=>document.getElementById('open').style.display='none',600);
});
</script></body></html>
